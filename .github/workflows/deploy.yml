name: Deploy

on:
  push:
    branches:
      - main
      - stage
      - dev
  workflow_dispatch:

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: self-hosted
    steps:
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/tg/tg-bot && git fetch origin dev && git reset --hard origin/dev
            echo "tg-bot updated - no container rebuild needed (mounted volume)"

  deploy-staging:
    if: github.ref == 'refs/heads/stage'
    runs-on: self-hosted
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/tg/tg-bot && git pull origin stage
            echo "tg-bot updated - no container rebuild needed (mounted volume)"

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/tg/tg-bot && git pull origin main
            echo "tg-bot updated - no container rebuild needed (mounted volume)"
