[project]
name = "tg-bot"
version = "0.1.0"
description = "Telegram Bot CLI for channel management and messaging"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.42.0",
    "pysocks>=1.7.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tg-bot = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
