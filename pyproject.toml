[project]
name = "tg-bot"
version = "0.1.0"
description = "Telegram Bot CLI for channel management and messaging"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.42.0",
    "pysocks>=1.7.1",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
]
monitoring = [
    "prometheus-client>=0.20.0",
    "python-logging-loki>=0.3.1",
]

[project.scripts]
tg-bot = "tgbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:seleniumbase"

[tool.coverage.run]
source = ["tgbot"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
